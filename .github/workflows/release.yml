permissions:
  contents: write
on:
  push:
    tags:
      - "v*" # run only against tags
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/marketplace/actions/checkout
      - uses: actions/checkout@v7
      - name: jq props and store module
        run: |
          echo "version=$(cat module.json | jq -r .version)" >> $GITHUB_ENV
          echo "minimum=$(cat module.json | jq -r .compatibility.minimum)" >> $GITHUB_ENV
          echo "maximum=$(cat module.json | jq -r .compatibility.maximum)" >> $GITHUB_ENV
          echo "verified=$(cat module.json | jq -r .compatibility.verified)" >> $GITHUB_ENV

          changelog_contents=""
          inside_section=false
          while IFS= read -r line; do
            if [[ $line == "# Version "* ]]; then
              if [ "$inside_section" = false ]; then
                inside_section=true
              else
                break
              fi
            fi
            if [ "$inside_section" = true ] && [[ $line != "# Version"* ]]; then
              changelog_contents="$changelog_contents$line"$'\n'
            fi
          done < changelog.md
          echo "$changelog_contents" > latest.md
      - name: Build release zip
        run: |
          rm private.md changelog.md readme.md license
          rm -rf .github .git
          zip -r map.zip .
      # https://github.com/marketplace/actions/gh-release
      - uses: softprops/action-gh-release@v3
        with:
          body_path: latest.md
          tag_name: v${{ env.version }}
          files: |
            module.json
            map.zip
      - name: foundry release
        env:
          FOUNDRY_TOKEN: ${{ secrets.FOUNDRY_TOKEN }}
        run: |
          JSON_PAYLOAD=$(cat <<EOF
          {
            "id": "map",
            "dry-run": false,
            "release": {
              "version": "${{ env.version }}",
              "manifest": "https://github.com/CodaBool/map-foss/releases/download/v${{ env.version }}/module.json",
              "notes": "https://github.com/CodaBool/map-foss/blob/main/changelog.md",
              "compatibility": {
                "minimum": "${{ env.minimum }}",
                "verified": "${{ env.verified }}",
                "maximum": "${{ env.maximum }}"
              }
            }
          }
          EOF
          )

          curl -s -X POST https://api.foundryvtt.com/_api/packages/release_version \
            -H "Content-Type: application/json" \
            -H "Authorization: ${FOUNDRY_TOKEN}" \
            -d "$JSON_PAYLOAD"